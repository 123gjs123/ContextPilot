<!doctype html>
<!-- Fixture SINTÉTICO de gemini.google.com (estructura según DOM observado 2025-2026). MANUAL: re-grabar desde una sesión real. -->
<html lang="es">
<head><meta charset="utf-8"><title>Gemini</title></head>
<body>
  <chat-app>
    <main class="chat-app">
      <bard-mode-switcher><button data-test-id="bard-mode-menu-button" class="gds-mode-switch-button"><span class="logo-pill-label-container">2.5 Pro</span></button></bard-mode-switcher>
      <chat-window>
        <div id="chat-history" class="chat-history">
          <infinite-scroller class="chat-history-scroll-container">
            <div class="conversation-container" id="c_prev1">
              <user-query><div class="user-query-container"><div class="query-text"><p class="query-text-line">¿Qué es un índice B-tree?</p></div></div></user-query>
              <model-response><div class="response-container"><message-content class="model-response-text"><div class="markdown markdown-main-panel"><p>Un B-tree es una estructura de árbol balanceado que mantiene datos ordenados y permite búsquedas, inserciones y borrados en tiempo logarítmico.</p></div></message-content></div></model-response>
            </div>
          </infinite-scroller>
        </div>
        <input-area-v2>
          <div class="input-area-container">
            <rich-textarea class="text-input-field_textarea">
              <div class="ql-editor ql-blank textarea new-input-ui" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Ingresá una instrucción para Gemini" data-placeholder="Preguntale a Gemini"><p><br></p></div>
            </rich-textarea>
            <button class="send-button submit" aria-label="Send message" type="button">▶</button>
          </div>
        </input-area-v2>
      </chat-window>
    </main>
  </chat-app>
</body>
</html>
