<!doctype html>
<!-- Fixture SINTÉTICO de chatgpt.com (chat nuevo vacío, compositor ProseMirror). MANUAL: re-grabar desde una sesión real. -->
<html lang="es">
<head><meta charset="utf-8"><title>ChatGPT</title></head>
<body>
  <div id="__next">
    <main>
      <div class="flex h-full flex-col"><div class="thread"></div></div>
      <form class="w-full" data-type="unified-composer">
        <div id="composer-background">
          <div contenteditable="true" translate="no" class="ProseMirror" id="prompt-textarea" data-virtualkeyboard="true"><p data-placeholder="Preguntá lo que quieras" class="placeholder"><br class="ProseMirror-trailingBreak"></p></div>
          <button id="composer-submit-button" data-testid="send-button" aria-label="Send prompt" type="submit">↑</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
